<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic webpage information and SEO metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Make an enquiry about eggs and chicken products from Ratshi's Eggs and Chicken.">

    <meta name="keywords"
        content="Ratshi's Eggs and Chicken enquiry, eggs, chicken, poultry">

    <meta name="author" content="Ratshi's Eggs and Chicken">

    <title>Enquiry | Ratshi's Eggs and Chicken</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website header and navigation -->
    <header>

        <img src="images/logo.png"
             alt="Ratshi's Eggs and Chicken logo"
             width="200">

        <h1>Ratshi's Eggs and Chicken</h1>

        <p>Fresh. Quality. Trusted.</p>

        <!-- Main website navigation -->
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="products.html">Products</a> |
            <a href="enquiry.html">Enquiry</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <!-- Main content of the enquiry page -->
    <main>
       <form id="enquiryForm" onsubmit="submitEnquiryForm(event)" style="max-width: 500px; margin: 20px auto; font-family: Arial, sans-serif;">
      <label for="eName" style="font-weight: bold;">Full Name:</label><br>
      <input type="text" id="eName" required placeholder="Enter your full name" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"><br>

      <label for="eEmail" style="font-weight: bold;">Email Address:</label><br>
      <input type="email" id="eEmail" required placeholder="name@example.com" style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"><br>

      <label for="eType" style="font-weight: bold;">Enquiry Type:</label><br>
      <select id="eType" required style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;">
        <option value="">-- Select Enquiry Subject --</option>
        <option value="Product Pricing & Cost">Product Pricing & Cost</option>
        <option value="Stock Availability">Stock Availability</option>
        <option value="Volunteer Opportunity">Volunteer Opportunity</option>
        <option value="Sponsorship">Sponsorship</option>
      </select><br>

      <label for="eMessage" style="font-weight: bold;">Enquiry Details:</label><br>
      <textarea id="eMessage" rows="5" required placeholder="Describe your enquiry..." style="width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box;"></textarea><br>

      <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
        Submit Enquiry
      </button>
       <form>
        
    </form>

    <!-- PROOF OF DELIVERY CONFIRMATION BOX -->
    <div id="enquirySuccessMsg" style="display: none; max-width: 500px; margin: 15px auto; padding: 15px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 6px; font-family: Arial, sans-serif;">
      <h4 style="margin: 0 0 5px 0;">✓ Delivery Confirmed!</h4>
      <p style="margin: 0;" id="enquiryDetailsText"></p>
    </div>

    <!-- JavaScript to Validate and Process Enquiry -->
    <script>
      function submitEnquiryForm(event) {
        event.preventDefault(); // Stop page from refreshing

        let name = document.getElementById('eName').value;
        let email = document.getElementById('eEmail').value;
        let type = document.getElementById('eType').value;

        // Display proof of delivery to user
        let successBox = document.getElementById('enquirySuccessMsg');
        let detailsText = document.getElementById('enquiryDetailsText');

        detailsText.innerText = "Thank you, " + name + "! Your enquiry regarding '" + type + "' has been successfully processed, validated, and delivered to Ratshi's Eggs and Chicken. We will respond with cost/availability details to " + email + " shortly.";
        
        successBox.style.display = 'block';

        // Reset the form input fields
        document.getElementById('enquiryForm').reset();
      }
    </script> 
    </main>

    <!-- Website footer -->
    <footer>

        <p>&copy; 2026 Ratshi's Eggs and Chicken. All rights reserved.</p>

    </footer>
<script src="script.js"></script>
</body>

</html>
